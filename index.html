<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b1b24">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6f7;--card:#fff;--ink:#2b1b24;--mute:#9a8190;--line:#f3dbe1;--acc:#2b1b24;--accink:#fff;--pink:#e7899f;--warn:#c2410c;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1217;--card:#251a21;--ink:#f7e9ee;--mute:#b79ca9;--line:#3a2933;--acc:#f4b6c6;--accink:#2b1b24;--pink:#f08fa8;--warn:#ff9a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1217;--card:#251a21;--ink:#f7e9ee;--mute:#b79ca9;--line:#3a2933;--acc:#f4b6c6;--accink:#2b1b24;--pink:#f08fa8;--warn:#ff9a74;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--card);border-right:2px solid var(--line);padding:26px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:italic 500 28px/1 var(--serif);margin:0 10px 22px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:14px;font:500 11.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-align:left;white-space:nowrap}
nav button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
nav button svg{flex:none}
main{flex:1;min-width:0;max-width:1120px;margin:0 auto;padding:30px 22px 60px}
h1{font:italic 500 44px/1.05 var(--serif);margin:0 0 4px}
h2{font:italic 500 26px/1.1 var(--serif);margin:0 0 10px}
p.sub{margin:0 0 18px;color:var(--mute)}
section.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font:500 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);gap:5px;flex:1 1 120px}
input,select,textarea{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px;width:100%}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button.go{background:var(--acc);color:var(--accink);border:2px solid var(--acc);border-radius:999px;padding:10px 20px;font:600 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
button.x{background:none;border:0;color:var(--mute);cursor:pointer;font:500 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px}
button.x:hover{color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.item .t{flex:1;min-width:0}
.item small,small{color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(43,27,36,.2)}
.empty{color:var(--mute);margin:4px 0}
.day{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:12px 0;border-top:2px solid var(--line)}
.day b{font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.blk{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;padding:10px 14px;border-radius:16px;background:var(--c);color:#2b1b24;border:2px solid rgba(43,27,36,.1)}
.blk small{color:rgba(43,27,36,.68);display:block}
.blk .att{color:#2b1b24;background:rgba(255,255,255,.55);border-color:rgba(43,27,36,.15)}
.warn{color:var(--warn);margin:4px 0}
.bar{height:10px;border-radius:5px;background:var(--c);display:inline-block;vertical-align:middle;margin-right:8px;border:1px solid rgba(43,27,36,.15)}
textarea{min-height:200px;font:12px/1.4 ui-monospace,Menlo,monospace}
.wk{margin:18px 0 0;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(84px,1fr));min-width:680px}
.ch{padding:6px 4px;border-left:1px solid var(--line);font-size:12px;cursor:pointer;border-radius:12px 12px 0 0}
.ch b{font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.ch.sel{background:var(--bg)}.tdy b{color:var(--pink)}
.chip{margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--c);color:#2b1b24;font-size:11px;line-height:1.3}
.hl{height:40px;font-size:11px;color:var(--mute)}
.cc{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 40px)}
.ev{position:absolute;left:2px;right:2px;overflow:hidden;border-radius:10px;padding:2px 6px;font-size:11px;line-height:1.25}
.st{background:var(--c);color:#2b1b24;border:1px solid rgba(43,27,36,.14)}
.bz{border:1px solid var(--line);color:var(--mute);background-color:var(--card);background-image:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px)}
.ex{border:1px dashed var(--pink);color:var(--ink);background:var(--card)}
.chip.tk{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.od{color:var(--warn)}
.att{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font:500 12px var(--sans);margin:4px 4px 0 0;cursor:pointer;text-decoration:none}
.hab{display:grid;grid-template-columns:minmax(120px,1.6fr) repeat(7,34px) 90px;gap:8px 2px;align-items:center;min-width:480px}.hab input[type=checkbox]{width:20px;height:20px;margin:auto;display:block;accent-color:var(--pink)}
.hh{text-align:center;font-size:11px;color:var(--mute)}.hh.tdy{color:var(--pink);font-weight:700}
.pb{height:10px;border-radius:5px;background:var(--bg);border:2px solid var(--line)}.pb i{display:block;height:100%;background:var(--pink);border-radius:5px}
.st2{flex:1 1 110px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;font:500 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.st2 b{display:block;font:italic 500 28px/1.1 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink)}
.cw{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.cwm{flex:1 1 560px;min-width:0}
.dp{flex:1 1 250px;max-width:340px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px}
.dpt{font:italic 500 38px/1 var(--serif)}.dps{color:var(--mute);margin:2px 0 14px}
.pc{background:var(--c);border:2px solid rgba(43,27,36,.1);border-radius:16px;padding:10px 14px;margin-bottom:10px;color:#2b1b24}
.pc small{color:rgba(43,27,36,.68)}.bzc{--c:var(--bg);color:var(--ink)}.bzc small{color:var(--mute)}
.nb{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:10px;overflow-x:auto}
.nc{background:var(--bg);border-radius:16px;padding:10px;min-width:170px}
.ncl{font:500 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.nt{margin-bottom:10px}.nt textarea{min-height:72px;font:14px/1.4 var(--sans)}
.compact section.card{padding:12px;margin-bottom:10px}.compact .item{padding:4px 0}.compact .row{gap:6px;margin-bottom:6px}.compact .day{padding:6px 0}
@media (max-width:860px){.shell{display:block}.side{position:sticky;top:0;z-index:20;width:auto;height:auto;padding:8px 10px;border-right:0;border-bottom:2px solid var(--line)}.brand{display:none}nav{flex-direction:row;overflow-x:auto}nav button{padding:9px 12px;font-size:10.5px;letter-spacing:.14em}main{padding:20px 14px 48px}h1{font-size:36px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">my planner</div><nav id="nav"></nav></aside>
<main>
<h1>my planner</h1>
<p class="sub">Study plan, calendar, tasks, habits and projects in one place.</p>
<div id="app"></div>
</main></div>
<script>
var S={a:[],m:[],v:[]},tab='setup',DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
try{var raw=localStorage.getItem('sp1');if(raw)S=JSON.parse(raw)}catch(e){}
var E={},W=null;function save(){S._ts=Math.max(Date.now(),(S._ts||0)+1);try{localStorage.setItem('sp1',JSON.stringify(S))}catch(e){}schedSync()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function id(){return Math.random().toString(36).slice(2,9)}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function p2(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function tm(min){return p2(Math.floor(min/60))+':'+p2(min%60)}
function tmin(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function nice(d){return MON[d.getMonth()].slice(0,3)+' '+d.getDate()}
function hex(h){var s=.55,l=.82,a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12;return('0'+Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16)).slice(-2)};return'#'+f(0)+f(8)+f(4)}
function color(c){var o=S.cfg&&S.cfg.cc&&S.cfg.cc[c];if(o)return o;var h=0;for(var i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))%360;return hex(h)}
function V(i){return document.getElementById(i).value}
function A(id){return S.a.filter(function(x){return x.id===id})[0]}

function addA(){var c=V('ac').trim(),d=V('ad');if(!c||!d)return;var o={course:c,type:V('at'),date:d,weight:+V('aw')||0,diff:+V('af'),prep:+V('ap')||0};if(E.k==='a'&&S.a[E.i])Object.assign(S.a[E.i],o);else{o.id=id();S.a.push(o)}E={};save();draw()}
function addM(){var n=V('mn').trim(),h=+V('mh');if(!n||!V('ma')||!h)return;var o={aid:V('ma'),name:n,hours:h},fs=[].slice.call(document.getElementById('mf').files||[]),lk=V('ml').trim(),t;if(E.k==='m'&&S.m[E.i]){t=S.m[E.i];Object.assign(t,o)}else{o.id=id();o.done=false;S.m.push(o);t=o}t.files=t.files||[];t.links=t.links||[];if(/^https?:\/\//i.test(lk))t.links.push(lk);E={};Promise.all(fs.map(function(f){var fid=id();return idbPut(fid,f).then(function(){t.files.push({id:fid,name:f.name,size:f.size})})})).catch(function(){}).then(function(){save();draw()})}
function addV(){var a=tmin(V('vs')),b=tmin(V('ve'));if(!(b>a))return;var o={day:+V('vd'),s:a,e:b};if(E.k==='v'&&S.v[E.i])Object.assign(S.v[E.i],o);else S.v.push(o);E={};save();draw()}
function del(k,i){E={};if(k==='m')((S.m[i]||{}).files||[]).forEach(function(f){idbDel(f.id).catch(function(){})});if(k==='a'){var x=S.a[i].id;S.m=S.m.filter(function(m){return m.aid!==x})}S[k].splice(i,1);save();draw()}
function tog(i){S.m[i].done=!S.m[i].done;S.m[i].doneOn=S.m[i].done?ymd(new Date()):'';save();draw()}

function plan(){
 var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 var q={},out=[],last=today;
 S.a.forEach(function(a){
  var ms=S.m.filter(function(m){return m.aid===a.id&&!m.done});
  var tot=ms.reduce(function(s,m){return s+m.hours},0);
  var it=ms.map(function(m){return{name:m.name,rem:Math.max(0,Math.round(m.hours*60-(m.spent||0))),all:Math.round(m.hours*60)}});
  var pr=a.prep==null?7:a.prep;
  if(tot>0&&pr>0){var ph=Math.max(1,Math.round(tot*0.3*2)/2);it.push({name:'Mixed review of all materials',rem:Math.round(ph*0.4*60/15)*15||30,prep:1});it.push({name:'Past exams under exam conditions',rem:Math.round(ph*0.6*60/15)*15||30,prep:1})}
  it.forEach(function(x){x.all=x.rem});
  q[a.id]=it;if(pd(a.date)>last)last=pd(a.date);
 });
 var blocks=S.v.slice().sort(function(x,y){return x.s-y.s});
 var cap=((S.cfg&&S.cfg.cap!=null)?+S.cfg.cap:2)*60,last2={},di=0,LI=Math.round((last-today)/864e5),hs=[];
 for(var k0=0;k0<=LI;k0++)hs.push(daySlots(new Date(today.getFullYear(),today.getMonth(),today.getDate()+k0)).length>0);
 for(var d=new Date(today);d<=last;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)){
  di++;var dm={},am={},mm={},pace={},cur=di-1;
  S.a.forEach(function(a){var pr=a.prep==null?7:a.prep,ws=Math.round((pd(a.date)-today)/864e5)-Math.max(pr,S.rest===false?0:1),n=0;for(var k1=cur;k1<ws&&k1<hs.length;k1++)if(hs[k1])n++;var rm=q[a.id].filter(function(x){return !x.prep}).reduce(function(s,x){return s+x.rem},0);pace[a.id]=n>0?Math.max(30,Math.ceil(rm/n*1.15/15)*15):1e9;mm[a.id]=0});
  (S.sl||[]).filter(function(l){return l.date===ymd(d)}).forEach(function(l){var kk=l.aid+'|'+l.name;dm[kk]=(dm[kk]||0)+l.e-l.s;am[l.aid]=(am[l.aid]||0)+l.e-l.s;mm[l.aid]=(mm[l.aid]||0)+l.e-l.s;last2[l.aid]=di});
  daySlots(d).forEach(function(b){
   var t=b.s;
   while(t<b.e){
    var best=null,bs=-1;
    S.a.forEach(function(a){
     var dl=Math.round((pd(a.date)-d)/864e5);if(dl<=(S.rest===false?0:1))return;
     var pr=a.prep==null?7:a.prep,it=null,room=0,urgent=dl<=3;
     q[a.id].forEach(function(x){if(it||x.rem<=0)return;if(x.prep){if(dl>pr)return;it=x;room=1e9;return}var used=dm[a.id+'|'+x.name]||0,left=pace[a.id]-mm[a.id];if((used<cap&&left>0)||urgent){it=x;room=urgent?1e9:Math.min(cap-used,left)}});
     if(!it)return;
     var rem=q[a.id].reduce(function(s,x){return s+x.rem},0)/60,gap=last2[a.id]==null?3:Math.min(di-last2[a.id],6);
     var sc=Math.max(a.weight,1)*a.diff*rem/(dl+1)*(1+0.35*gap)/(1+(am[a.id]||0)/120);
     if(sc>bs){bs=sc;best={a:a,it:it,room:room}}
    });
    if(!best)break;
    var len=Math.min(b.e-t,best.it.rem,best.room);
    if(!(len>0))break;
    out.push({date:new Date(d),s:t,e:t+len,a:best.a,name:best.it.name});
    best.it.rem-=len;t+=len;
    var key=best.a.id+'|'+best.it.name;dm[key]=(dm[key]||0)+len;am[best.a.id]=(am[best.a.id]||0)+len;if(!best.it.prep)mm[best.a.id]+=len;last2[best.a.id]=di;
   }
  });
 }
 var short=[];
 S.a.forEach(function(a){var r=q[a.id].reduce(function(s,x){return s+x.rem},0);if(r>0)short.push({a:a,h:r/60})});
 return{out:out,short:short};
}
function csv(out){
 function f(d,m){var h=Math.floor(m/60),ap=h>=12?'PM':'AM';h=h%12||12;return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' '+h+':'+p2(m%60)+' '+ap}
 var r=['Name,Date,Course,Material,Assessment,Hours'];
 out.forEach(function(x){
  var n=x.a.course+' - '+x.name,as=x.a.course+' '+x.a.type+' ('+x.a.date+')';
  r.push([n,f(x.date,x.s)+' \u2192 '+f(x.date,x.e),x.a.course,x.name,as,((x.e-x.s)/60).toFixed(2)].map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(','));
 });
 return r.join('\n');
}
function mon(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}

function viewSetup(){
 var h='<section class="card"><h2>1. Tests and exams</h2><div class="row">'+
 '<label>Course<input id="ac" placeholder="e.g. Macroeconomics"></label>'+
 '<label>Type<select id="at"><option>Exam</option><option>Test</option><option>Assignment</option></select></label>'+
 '<label>Date<input id="ad" type="date"></label>'+
 '<label>Weight (% of grade)<input id="aw" type="number" min="0" max="100" value="30"></label>'+
 '<label>Difficulty<select id="af"><option value="1">1 Easy</option><option value="2">2</option><option value="3" selected>3 Medium</option><option value="4">4</option><option value="5">5 Hard</option></select></label>'+
 '<label>Final prep (days)<input id="ap" type="number" min="0" max="30" value="7"></label>'+
 '<button class="go" onclick="addA()">Add assessment</button></div>';
 if(!S.a.length)h+='<p class="empty">No assessments yet. Add your first test or exam.</p>';
 S.a.forEach(function(a,i){h+='<div class="item"><span class="dot" style="background:'+color(a.course)+'"></span><div class="t">'+esc(a.course)+' '+esc(a.type)+'<br><small>'+nice(pd(a.date))+' · '+a.weight+'% · difficulty '+a.diff+' · '+(a.prep==null?7:a.prep)+' prep days</small></div><button class="x" aria-label="Edit" onclick="edit(\'a\','+i+')">Edit</button><button class="x" aria-label="Delete" onclick="del(\'a\','+i+')">\u00d7</button></div>'});
 h+='</section><section class="card"><h2>2. Materials for each assessment</h2>';
 if(!S.a.length)h+='<p class="empty">Add an assessment first.</p>';
 else{
  h+='<div class="row"><label>Assessment<select id="ma">'+S.a.map(function(a){return'<option value="'+a.id+'">'+esc(a.course)+' '+esc(a.type)+'</option>'}).join('')+'</select></label>'+
  '<label>Material<input id="mn" placeholder="e.g. Slides ch. 3"></label>'+
  '<label>Hours to study<input id="mh" type="number" min="0.5" step="0.5" value="2"></label>'+
  '<label>Attach files<input id="mf" type="file" multiple></label><label>Or add a link<input id="ml" placeholder="https://..."></label>'+
  '<button class="go" onclick="addM()">Add material</button></div>';
  h+='<p class="empty">Materials are studied in the order you add them.</p>';
  S.m.forEach(function(m,i){var a=A(m.aid);if(!a)return;h+='<div class="item"><input type="checkbox" style="width:auto" aria-label="Done" '+(m.done?'checked':'')+' onchange="tog('+i+')"><span class="dot" style="background:'+color(a.course)+'"></span><div class="t" style="'+(m.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(m.name)+'<br><small>'+esc(a.course)+' '+esc(a.type)+' · '+m.hours+' h'+(m.spent?' · '+(m.spent/60).toFixed(1)+' h done':'')+'</small>'+attHtml(m)+'</div><button class="x" aria-label="Edit" onclick="edit(\'m\','+i+')">Edit</button><button class="x" aria-label="Delete" onclick="del(\'m\','+i+')">\u00d7</button></div>'});
 }
 h+='</section><section class="card"><h2>3. Weekly free time for studying</h2><div class="row">'+
 '<label>Day<select id="vd">'+[1,2,3,4,5,6,0].map(function(d){return'<option value="'+d+'">'+DAYS[d]+'</option>'}).join('')+'</select></label>'+
 '<label>From<input id="vs" type="time" value="14:00"></label><label>To<input id="ve" type="time" value="17:00"></label>'+
 '<button class="go" onclick="addV()">Add time block</button></div>'+
